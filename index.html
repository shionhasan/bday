<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#ffd9e2">
    <title>Happy Birthday</title>

    <!-- Fonts for the message text (needs internet; falls back to system fonts offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="scene" id="scene">
        <div class="canvas-wrap">
            <canvas id="canvas" aria-label="A heart seed that grows into a tree of hearts"></canvas>
            <p class="hint" id="hint">Tap the heart ❤️</p>
        </div>

        <section class="message" id="message">
            <div class="message-inner">
                <div id="lines"></div>
                <p class="clock" id="clock"></p>
            </div>
        </section>
    </main>

    <!-- Put your music file next to this page and name it aud.mp3 -->
    <audio id="myAudio" src="aud.mp3" preload="auto"></audio>

    <noscript>Please enable JavaScript to see the birthday surprise.</noscript>
    <script src="script.js"></script>
</body>
</html>
